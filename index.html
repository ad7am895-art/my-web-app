<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو خلفيات الشاشة الفخمة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Orbitron:wght@500;700;900&family=Amiri:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0f15;
      --card-bg: #1a1a24;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #14141d;
      border-bottom: 1px solid #2e2e3e;
    }

    header h1 {
      font-size: 1.5rem;
      color: #fff;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 30px 15px;
      flex: 1;
    }

    /* معاينة الهاتف */
    .phone-container {
      position: relative;
      width: 320px;
      height: 650px;
      background: #000;
      border-radius: 48px;
      border: 10px solid #2d2d3a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.2);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* الجزيرة التفاعلية Dynamic Island */
    .notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    .lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: background-image 0.4s ease-in-out, filter 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 20px 40px;
    }

    /* الساعة */
    .clock-widget {
      text-align: center;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      z-index: 5;
    }

    .clock-date {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .clock-time {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      font-family: 'Orbitron', Cairo, sans-serif;
    }

    /* أدوات أسفل شاشة القفل */
    .bottom-widgets {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      padding: 0 10px;
    }

    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* لوحة التحكم */
    .controls-card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid #2d2d3d;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #9ca3af;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #111827;
      color: #fff;
      outline: none;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .wallpaper-thumb {
      width: 100%;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    .wallpaper-thumb:hover, .wallpaper-thumb.active {
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .btn-upload {
      display: block;
      width: 100%;
      padding: 10px;
      text-align: center;
      background: #2d2d3f;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      border: 1px dashed #4b5563;
      margin-top: 10px;
    }

    .btn-download {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background: var(--accent-hover);
    }

    /* ملائمة الشاشات الصغيرة */
    @media (max-width: 480px) {
      .phone-container {
        width: 280px;
        height: 570px;
      }
      .clock-time {
        font-size: 3.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>صانع خلفيات وشاشات القفل الفخمة</h1>
  </header>

  <div class="container">
    <!-- محاكي شاشة الجوال -->
    <div class="phone-container">
      <div class="notch"></div>
      <div class="lock-screen" id="lockScreen" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000');">
        <div class="clock-widget" id="clockWidget">
          <div class="clock-date" id="clockDate">الأحد، ٢٧ سبتمبر</div>
          <div class="clock-time" id="clockTime">13:24</div>
        </div>
        <div class="bottom-widgets">
          <div class="action-btn">🔦</div>
          <div class="action-btn">📷</div>
        </div>
      </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-card">
      
      <!-- اختيار الخلفية -->
      <div class="control-group">
        <div class="section-title">🖼️ اختيار الخلفية</div>
        <div class="grid-options">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300" class="wallpaper-thumb active" onclick="setWallpaper(this.src)">
          <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=300" class="wallpaper-thumb" onclick="setWallpaper(this.src)">
          <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=300" class="wallpaper-thumb" onclick="setWallpaper(this.src)">
          <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=300" class="wallpaper-thumb" onclick="setWallpaper(this.src)">
        </div>
        <label class="btn-upload">
          رفع خلفية من جوالك 📤
          <input type="file" id="imageUploader" accept="image/*" style="display: none;">
        </label>
      </div>

      <!-- تخصيص الساعة -->
      <div class="control-group">
        <div class="section-title">⏰ تخصيص الساعة</div>
        
        <label>نوع الخط (Font)</label>
        <select id="fontSelect" onchange="updateClockStyle()">
          <option value="'Orbitron', sans-serif">عصري / Modern (Orbitron)</option>
          <option value="'Cairo', sans-serif">عربي حديث (Cairo)</option>
          <option value="'Tajawal', sans-serif">بسيط (Tajawal)</option>
          <option value="'Amiri', serif">كلاسيكي (Amiri)</option>
        </select>

        <div style="display: flex; gap: 15px; margin-top: 12px;">
          <div style="flex: 1;">
            <label>لون الساعة</label>
            <input type="color" id="clockColor" value="#ffffff" onchange="updateClockStyle()">
          </div>
          <div style="flex: 1;">
            <label>تأثير الضباب (Blur)</label>

            <select id="blurSelect" onchange="updateBlur()">
              <option value="0px">بدون</option>
              <option value="2px">خفيف</option>
              <option value="5px">متوسط</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn-download" onclick="downloadPreview()">تحميل التصميم 📥</button>
    </div>
  </div>

  <!-- مكتبة html2canvas لالتقاط الشاشة وتحميلها -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // تحديث الوقت تلقائياً
    function updateLiveTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('clockDate').textContent = now.toLocaleDateString('ar-SA', options);
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    // تغيير الخلفية
    function setWallpaper(url) {
      document.getElementById('lockScreen').style.backgroundImage = `url('${url}')`;
      document.querySelectorAll('.wallpaper-thumb').forEach(thumb => {
        thumb.classList.remove('active');
        if(thumb.src === url) thumb.classList.add('active');
      });
    }

    // رفع خلفية خاصة
    document.getElementById('imageUploader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          setWallpaper(event.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // تعديل خط ولون الساعة
    function updateClockStyle() {
      const font = document.getElementById('fontSelect').value;
      const color = document.getElementById('clockColor').value;
      
      const clockWidget = document.getElementById('clockWidget');
      clockWidget.style.fontFamily = font;
      clockWidget.style.color = color;
      document.getElementById('clockTime').style.fontFamily = font;
    }

    // تعديل ضبابية الخلفية
    function updateBlur() {
      const blurValue = document.getElementById('blurSelect').value;
      document.getElementById('lockScreen').style.backdropFilter = `blur(${blurValue})`;
    }

    // تحميل التصميم كصورة عالية الدقة
    function downloadPreview() {
      const phone = document.querySelector('.phone-container');
      html2canvas(phone, { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'lockscreen-wallpaper.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
